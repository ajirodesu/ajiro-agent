plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.terminalpty'
version = '1.0.0'

android {
  namespace "expo.modules.terminalpty"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    ndk {
      // On-device Linux runtime is ARM64-only (Debian Bookworm aarch64).
      abiFilters "arm64-v8a"
    }
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17 -fexceptions"
        abiFilters "arm64-v8a"
        // The C++ bridge uses STL (string/vector/mutex/exceptions): link the
        // shared runtime explicitly (Gradle also packages libc++_shared.so).
        // Without this the link fails with undefined `operator new`/`std::*`.
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1+"
    }
  }
}

dependencies {
  // Pure-Java tar parsing (no NDK dependency).
  implementation("org.apache.commons:commons-compress:1.26.0")
  // Pure-Java XZ decoder (Tukaani) for .tar.xz rootfs archives.
  implementation("org.tukaani:xz:1.9")
}
